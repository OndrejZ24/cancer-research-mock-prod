name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (versions from uv.lock, CPU-only torch)
        run: uv sync --locked
      - name: Lint
        run: uvx ruff check --select F,E9 src scripts tests
      - name: Tests (synthetic data; the licensed-data tests are skipped)
        run: uv run pytest -v
      - name: Command line demo
        run: uv run chordsurv demo
