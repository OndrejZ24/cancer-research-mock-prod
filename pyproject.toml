[project]
name = "chordsurv"
version = "0.1.1"
description = "Survival modelling on MSK-CHORD: 6-month landmark risk of death, survival by cancer type, immunotherapy vs chemotherapy in stage 4 NSCLC"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2,<3",
    "pyarrow>=18",
    "scikit-learn>=1.6",
    "scikit-survival>=0.24",
    "lifelines>=0.30",
    "statsmodels>=0.14",
    "xgboost>=3.0",
    "torch>=2.6",
    "matplotlib>=3.9",
]

[project.scripts]
chordsurv = "chordsurv.cli:main"

[dependency-groups]
dev = ["pytest>=8", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chordsurv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# expected input warnings from the bad-input tests (pytest.warns still sees them)
filterwarnings = ["ignore::chordsurv.api.InputWarning"]

# On Linux (e.g. GitHub Actions) take the CPU-only torch build instead of the multi-GB CUDA one
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
